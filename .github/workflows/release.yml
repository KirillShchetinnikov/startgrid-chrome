name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          manifest_version="$(node -p "require('./static/manifest.json').version")"
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${RELEASE_TAG#v}"

          test "$tag_version" = "$manifest_version"
          test "$tag_version" = "$package_version"

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci

      - name: Lint extension
        run: npm run lint

      - name: Build Chrome extension
        run: npm run build

      - name: Install test browser
        run: npx puppeteer browsers install chrome

      - name: Run unit and extension browser tests
        env:
          PUPPETEER_HEADLESS: 'true'
          PUPPETEER_NO_SANDBOX: 'true'
        run: npm test -- --runInBand

      - name: Package extension
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          npm run zip
          mv startgrid-chrome.zip "dist/startgrid-chrome-${RELEASE_TAG}.zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip --title "StartGrid ${RELEASE_TAG#v}" --generate-notes --verify-tag
